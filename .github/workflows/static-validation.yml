name: Static Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  py-compile:
    name: Python syntax validation and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile padiem_ai Python files
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          roots = [Path('padiem_ai/padiem_ai'), Path('tests')]
          files = []
          for root in roots:
              if root.exists():
                  files.extend(sorted(root.rglob('*.py')))

          if not files:
              raise SystemExit('No Python files found to compile')

          for path in files:
              py_compile.compile(str(path), doraise=True)

          print(f'Compiled {len(files)} Python files')
          PY

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
